name: Windows CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 解析・テスト・Windows ビルド
    runs-on: windows-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Flutter を設定
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係を取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test

      - name: Windows Release をビルド
        run: flutter build windows --release

      - name: 配布バンドルを作成
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath VillagerTranslator-windows-x64.zip

      - name: 配布バンドルを保存
        uses: actions/upload-artifact@v4
        with:
          name: VillagerTranslator-windows-x64
          path: VillagerTranslator-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub Release を作成
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 配布バンドルを取得
        uses: actions/download-artifact@v4
        with:
          name: VillagerTranslator-windows-x64
          path: release

      - name: リリースを作成
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/VillagerTranslator-windows-x64.zip