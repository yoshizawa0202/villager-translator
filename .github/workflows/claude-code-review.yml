name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Flutter アプリ本体・テスト・仕様書に関わる変更のみレビュー対象にする
    paths:
      - "lib/**"
      - "test/**"
      - "docs/specs/**"
      - "pubspec.yaml"
      - "pubspec.lock"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Flutter を設定
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係を取得
        run: flutter pub get

      - name: Claude Code レビューを実行
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # AGENTS.md（CLAUDE.md からインポート）の言語方針に合わせ、レビューの要約・指摘コメントを日本語で出力させる
          # レビュー中に flutter test / flutter analyze などを実行できるようにする
          claude_args: |
            --append-system-prompt "PRレビューの要約・指摘コメントは必ず日本語で記述してください。コードや識別子名は元の言語（英語）のまま変更しないでください。"
            --allowed-tools "Bash(flutter *),Bash(dart *)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

